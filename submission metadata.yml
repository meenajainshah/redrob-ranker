methodology_summary: >
  Hybrid CPU-only ranker. The JD is parsed into a structured requirement model; candidates
  are scored from lexical relevance (local hashing-TF cosine to the JD) plus production IR/ML
  evidence mined from career-history text, experience-band fit and product-company exposure.
  Rule gates floor honeypots and penalise keyword-stuffers, non-engineering, services-only,
  research-only, CV-only, LangChain-only and title-chasers; a behavioural-availability
  multiplier and a location factor finish the score. Reasoning is generated from real fields
  (no LLM at ranking time). Ranks 100k candidates in ~70 s, ~1 GB RAM, CPU-only, no network.
